name: Bootstrap Checks

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  bootstrap-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup ruff
        uses: astral-sh/ruff-action@v3

      - name: Install lefthook
        run: |
          version=2.2.2
          case "$(uname -m)" in
            x86_64) asset="Linux_x86_64" ;;
            aarch64|arm64) asset="Linux_arm64" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/lefthook.gz" \
            "https://github.com/evilmartians/lefthook/releases/download/v${version}/lefthook_${version}_${asset}.gz"
          gunzip -c "$RUNNER_TEMP/lefthook.gz" > "$RUNNER_TEMP/lefthook"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/lefthook" "$HOME/.local/bin/lefthook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/lefthook" version

      - name: Bootstrap scan
        run: task bootstrap:scan

      - name: Doctor
        run: task doctor
